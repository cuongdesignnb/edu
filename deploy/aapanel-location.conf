# Merge inside the EXISTING aaPanel SSL server block, replacing its location /.
# Replace REPLACE_APP_PORT with APP_PORT (default 18763). Do not paste a server{}.
# Keep aaPanel's existing /.well-known/ location and certificate/renew directives.
# Remove any competing proxy/cache include that defines the same locations.
location / {
    proxy_pass http://127.0.0.1:REPLACE_APP_PORT;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Connection "";
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
    client_max_body_size 26m;
    proxy_cache off;
    proxy_buffering off;
    proxy_intercept_errors off;
    add_header Cache-Control "no-store" always;
    # Parent links can carry credentials in paths/query strings.
    # Disable this vhost's proxy access/error records; keep ACME logs separately.
    access_log off;
    error_log /dev/null crit;
}
