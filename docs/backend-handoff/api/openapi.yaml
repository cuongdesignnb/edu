openapi: 3.0.3
info:
  title: EduManage Backend API
  version: 1.0.0-design
  description: Hợp đồng triển khai core; chưa phải API đã chạy. PostgreSQL 17; phần auth của frontend mock được thay
    bằng auth thật. schoolId/classId là ngữ cảnh, không phải quyền. Mọi mutation dùng CSRF, version và idempotency theo
    docs. Ví dụ dữ liệu giả.
servers:
- url: /api/v1
  description: Same-origin qua gateway; local http://127.0.0.1:18763
tags:
- name: Activities
- name: Announcements
- name: Attendance
- name: Audit
- name: Auth
- name: Classroom
- name: Conduct
- name: Files
