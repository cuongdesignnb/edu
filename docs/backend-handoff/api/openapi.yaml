          items:
            type: string
        csrfToken:
          type: string
        mode:
          type: string
          enum:
          - connected
        serverNow:
          type: string
          format: date-time
      required:
      - user
      - memberships
      - platformActions
      - csrfToken
      - mode
      - serverNow
      additionalProperties: false
    LoginResult:
