components:
  schemas:
    Error:
      type: object
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        code:
          type: string
        detail:
          type: string
        requestId:
          type: string
        fieldErrors:
          type: array
          items:
            type: object
            properties:
              path:
                type: string
              code:
                type: string
              message:
                type: string
            required:
            - path
            - code
            - message
            additionalProperties: false
        currentVersion: &id003
          type: integer
          minimum: 1
      required:
      - type
      - title
      - status
      - code
      - requestId
      additionalProperties: false
    Ack:
      type: object
      properties:
        id: *id001
        status:
          type: string
        version: *id003
      required:
      - id
      - status
      additionalProperties: false
    Health:
      type: object
      properties:
        status:
          type: string
          enum:
          - ok
          - degraded
        buildSha:
          type: string
      required:
      - status
      additionalProperties: false
    ReasonCommand:
      type: object
      properties:
        expectedVersion: *id003
        reason:
          type: string
          minLength: 3
          maxLength: 2000
      required:
      - expectedVersion
      - reason
      additionalProperties: false
    VersionCommand:
      type: object
      properties:
        expectedVersion: *id003
      required:
      - expectedVersion
      additionalProperties: false
    PageInfo:
      type: object
      properties:
        nextCursor:
          type: string
          nullable: true
        hasMore:
          type: boolean
        limit:
          type: integer
        total:
          type: integer
          minimum: 0
      required:
      - nextCursor
      - hasMore
      - limit
      additionalProperties: false
    GrantView:
      type: object
      properties:
        id: *id001
        version: *id003
        roleId: *id001
        roleLabel: &id005
          type: string
          minLength: 1
          maxLength: 200
        roleCode:
          type: string
        assignmentStartsOn:
          type: string
          format: date
          nullable: true
        assignmentEndsOn:
          type: string
          format: date
          nullable: true
        actions:
          type: array
          items:
            type: string
        scopeType:
          type: string
          enum:
          - SCHOOL
          - CLASS
          - SUBJECT
        classId:
          type: string
          format: uuid
        subjectId:
          type: string
          format: uuid
        validFrom: &id004
          type: string
          format: date-time
        validUntil:
          type: string
          format: date-time
          nullable: true
      required:
      - id
      - version
      - roleId
      - roleLabel
      - roleCode
      - actions
      - scopeType
      - validFrom
      - validUntil
      additionalProperties: false
    User:
      type: object
      properties:
        id: *id001
        version: *id003
        createdAt: *id004
        updatedAt: *id004
        displayName: *id005
        workPhone:
          type: string
          maxLength: 40
          nullable: true
        bio:
          type: string
          maxLength: 2000
          nullable: true
        email:
          type: string
          format: email
        status:
          type: string
          enum:
          - INVITED
          - ACTIVE
          - LOCKED
      required:
      - id
      - version
      - createdAt
      - updatedAt
      - displayName
      - email
      - status
      additionalProperties: false
    Context:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/User'
        memberships:
          type: array
          items:
            type: object
            properties:
              schoolId: *id001
              schoolName: *id005
              schoolSlug:
                type: string
              schoolShortName:
                type: string
              schoolStatus:
                type: string
                enum: [DRAFT, ACTIVE, SUSPENDED, ARCHIVED]
              department:
                type: string
              timezone:
                type: string
              today:
                type: string
                format: date
              schoolWorkspace:
                type: boolean
              teacherWorkspace:
                type: boolean
              duties:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                      format: uuid
                    classId:
                      type: string
                      format: uuid
                    className:
                      type: string
                    subjectId:
                      type: string
                      format: uuid
                      nullable: true
                    subjectName:
                      type: string
                      nullable: true
                    kind:
