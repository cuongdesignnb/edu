- name: Imports
- name: Notifications
- name: Parent
- name: ParentAccess
- name: Platform
- name: Public
- name: Publication
- name: Reports
- name: Schedule
- name: School
- name: Settings
- name: Staff
- name: Students
- name: Support
- name: Teacher
