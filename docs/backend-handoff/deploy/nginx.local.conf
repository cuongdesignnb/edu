worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;
  log_format safe '$request_id $request_method $uri $status $request_time';
  access_log /dev/stdout safe;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;
  resolver 127.0.0.11 valid=10s ipv6=off;
  client_max_body_size 26m;
  client_body_timeout 30s;
  keepalive_timeout 30s;
  gzip on;
  gzip_types text/plain text/css application/json application/javascript image/svg+xml;
  gzip_min_length 1024;
  server {
    listen 8080;
    set $api http://api:3001;
    set $web http://web:3000;
    location = /gateway-health { access_log off; return 200 'ok'; }
    # No authority derived from browser-supplied X-User/X-Role/X-School headers.
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Request-ID $request_id;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
    
    location /api/ {
      proxy_pass $api$request_uri;
      proxy_buffering off;
      add_header Cache-Control "no-store" always;
    }
    location /p/ {
      proxy_pass $web$request_uri;
      proxy_buffering off;
      access_log off;
      add_header Cache-Control "no-store" always;
      add_header Referrer-Policy "no-referrer" always;
      add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    }
    location / {
      proxy_pass $web$request_uri;
      proxy_buffering off;
    }
  }
}
