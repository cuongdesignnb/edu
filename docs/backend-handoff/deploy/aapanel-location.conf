# Chỉ là location cho vhost aaPanel đã có domain + SSL; KHÔNG thay toàn bộ vhost.
# Xóa/điều chỉnh location / cũ nếu trùng. Giữ nguyên ACME/.well-known và chứng chỉ aaPanel.
location / {
    proxy_pass http://127.0.0.1:18763;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Connection "";
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
    proxy_buffering off;
    client_max_body_size 26m;
}
# HTTPS redirect bật trong aaPanel; APP_URL=https://domain-chinh-xac.
# Không cần Cloudflare. Không mở 18763 ra Internet. Không cache private CMS/API/parent.
